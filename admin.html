<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Growthwell Admin | Premium Dashboard</title>
  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="logo.jpeg" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; overflow-x: hidden; }
    #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }
    
    .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .input { width: 100%; padding: 12px 16px; margin-bottom: 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(15, 23, 42, 0.6); color: white; transition: all 0.3s; }
    .input:focus { outline: none; border-color: #ef4444; box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.25); background: rgba(15, 23, 42, 0.9); }
    .btn-primary { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.3s; border: none; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(239, 68, 68, 0.5); }
    
    .tab-btn { color: #94a3b8; border: 1px solid transparent; }
    .tab-btn.active { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); font-weight: 600; }
    .view-section { display: none; animation: fadeIn 0.4s ease-out; }
    .active-view { display: block; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row w-full">

  <!-- 3D Background -->
  <div id="bg-canvas"></div>

  <!-- Sidebar (Sticky on Mobile & Desktop) -->

    <div class="p-4 md:p-6 flex justify-between items-center md:block">
      <div class="flex items-center gap-3">
        <img src="logo3.jpeg" alt="Growthwell" class="h-10 md:h-12 object-contain rounded-lg shadow-lg">
        <div>
          <h1 class="text-xl font-extrabold text-white tracking-wide leading-tight hidden md:block">Growthwell</h1>
          <span class="text-[10px] font-bold text-red-400 tracking-widest uppercase bg-red-500/10 px-2 py-0.5 rounded-full block w-max mt-0.5">Admin Portal</span>
        </div>
      </div>
      <button class="md:hidden text-3xl text-slate-300 focus:outline-none p-2 rounded-lg hover:bg-slate-800/50 transition" onclick="document.getElementById('mobileNav').classList.toggle('hidden')">☰</button>
    </div>
    
    <nav id="mobileNav" class="hidden md:flex flex-col flex-grow p-4 space-y-2 bg-slate-900/95 md:bg-transparent backdrop-blur-xl absolute md:relative w-full left-0 top-full md:top-auto border-b md:border-b-0 border-slate-700/50 shadow-2xl md:shadow-none z-50">
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 ml-2 mt-2">Menu</p>
      <button onclick="switchTab('products')" id="tab-products" class="tab-btn active w-full text-left px-4 py-3.5 rounded-xl transition-all flex items-center gap-3">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
        Products
      </button>
      <button onclick="switchTab('orders')" id="tab-orders" class="tab-btn w-full text-left px-4 py-3.5 rounded-xl transition-all flex items-center gap-3">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
        Orders
      </button>
      <div class="pt-6 mt-auto border-t border-slate-700/50 md:block">
        <a href="index.html" class="flex items-center justify-center gap-2 w-full text-sm font-semibold text-slate-300 hover:text-white py-3 rounded-xl bg-slate-800/50 hover:bg-slate-700/50 border border-slate-600/50 transition-all">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
          Visit Storefront
        </a>
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-grow p-4 md:p-8 overflow-y-auto overflow-x-hidden w-full max-w-full z-10">
    
    <!-- 1. PRODUCTS VIEW -->
    <section id="view-products" class="view-section active-view max-w-7xl mx-auto w-full">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 md:mb-8 gap-4">
        <div>
          <h2 class="text-2xl md:text-3xl font-bold text-white">Products</h2>
          <p class="text-slate-400 text-sm mt-1">Manage your store inventory</p>
        </div>
      </div>

      <div class="grid lg:grid-cols-12 gap-6 md:gap-8">
        <!-- Add Product Form -->
        <div class="lg:col-span-4 w-full">
          <div class="glass-panel p-5 md:p-6 rounded-2xl md:sticky top-24">
            <h3 class="font-bold text-lg text-white mb-6 flex items-center gap-2">
              <span class="bg-red-500/20 text-red-400 p-1.5 rounded-lg"><svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg></span>
              Add New Product
            </h3>
            
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Product Name</label>
            <input id="pName" placeholder="e.g. Premium Dog Food" class="input">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-0 sm:gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Price (Rs.)</label>
                <input id="pPrice" type="number" placeholder="0.00" class="input">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Pet Type</label>
                <select id="pType" class="input appearance-none">
                  <option value="All">All Pets</option>
                  <option value="Dog">Dogs 🐶</option>
                  <option value="Cat">Cats 🐱</option>
                </select>
              </div>
            </div>

            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Keywords (Comma separated)</label>
            <input id="pKeywords" placeholder="e.g. food, vitamins" class="input">
            
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Description</label>
            <textarea id="pDesc" placeholder="Product details..." class="input resize-none h-24"></textarea>
            
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Product Image</label>
            <div class="relative border-2 border-dashed border-slate-600 rounded-xl p-4 text-center hover:bg-slate-800/50 transition cursor-pointer mb-4">
              <input type="file" id="pImageFile" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
              <div class="text-slate-400 flex flex-col items-center">
                <svg class="w-8 h-8 mb-2 text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span class="text-sm font-medium">Tap to upload image</span>
              </div>
            </div>
            
            <!-- Image Preview -->
            <div id="previewContainer" class="hidden mb-4 relative group">
              <img id="imgPreview" class="w-full h-40 object-cover rounded-xl border border-slate-600">
              <button onclick="clearImage()" class="absolute top-2 right-2 bg-red-500 text-white p-1.5 rounded-lg opacity-100 md:opacity-0 group-hover:opacity-100 transition shadow-lg"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>

            <button onclick="addProduct()" class="btn-primary w-full mt-2 flex justify-center items-center gap-2" id="addBtn">
              <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
              Publish Product
            </button>
          </div>
        </div>

        <!-- Product List -->
        <div class="lg:col-span-8 flex flex-col gap-6 w-full max-w-full">
          <!-- Filters -->
          <div class="glass-panel p-4 rounded-2xl flex flex-col sm:flex-row gap-4 w-full">
            <div class="flex-grow relative">
              <svg class="w-5 h-5 absolute left-3 top-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
              <input type="text" id="searchProduct" placeholder="Search products..." class="input m-0 pl-10" oninput="renderProducts()">
            </div>
            <div class="w-full sm:w-40 shrink-0">
              <select id="filterPetType" class="input m-0 appearance-none bg-slate-800" onchange="renderProducts()">
                <option value="All">All Types</option>
                <option value="Dog">Dogs 🐶</option>
                <option value="Cat">Cats 🐱</option>
              </select>
            </div>
          </div>

          <!-- Mobile Friendly Product List (Replaced Table with Cards) -->
          <div class="glass-panel p-4 md:p-6 rounded-2xl shadow-2xl w-full">
            <div id="adminProductList" class="flex flex-col gap-3">
              <div class="p-8 text-center text-slate-400">Loading inventory...</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. ORDERS VIEW -->
    <section id="view-orders" class="view-section max-w-7xl mx-auto w-full">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 md:mb-8 gap-4">
        <div>
          <h2 class="text-2xl md:text-3xl font-bold text-white">Orders</h2>
          <p class="text-slate-400 text-sm mt-1">Review customer orders</p>
        </div>
      </div>
      <div class="grid gap-6 w-full" id="adminOrdersList">
        <div class="glass-panel p-10 rounded-2xl text-center text-slate-400">Loading orders...</div>
      </div>
    </section>
  </main>

  <!-- Three.js Background Script -->
  <script>
    const canvas = document.getElementById('bg-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    canvas.appendChild(renderer.domElement);

    // Create 3D Pet Sprites (Emojis) Only
    function createEmojiTexture(emoji) {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.font = '80px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.globalAlpha = 0.3; // Soft transparency for admin panel
        ctx.fillText(emoji, 64, 64 + 10);
        return new THREE.CanvasTexture(canvas);
    }

    // Only Dog and Cat related emojis
    const petEmojis = ['🐶', '🐱', '🐾', '🦴'];
    const spriteMaterials = petEmojis.map(emoji => {
        return new THREE.SpriteMaterial({ map: createEmojiTexture(emoji), transparent: true });
    });

    const sprites = [];
    const spriteCount = window.innerWidth < 768 ? 15 : 35; // Less sprites on mobile for performance

    for (let i = 0; i < spriteCount; i++) {
        const mat = spriteMaterials[Math.floor(Math.random() * spriteMaterials.length)];
        const sprite = new THREE.Sprite(mat);
        
        sprite.position.x = (Math.random() - 0.5) * 30;
        sprite.position.y = (Math.random() - 0.5) * 20;
        sprite.position.z = (Math.random() - 0.5) * 10 - 2;
        
        const scale = Math.random() * 0.8 + 0.4;
        sprite.scale.set(scale, scale, 1);

        sprite.userData = {
            speedY: Math.random() * 0.015 + 0.005,
            sinSpeed: Math.random() * 0.02 + 0.01,
            sinOffset: Math.random() * Math.PI * 2,
            initialX: sprite.position.x,
            parallaxFactor: Math.random() * 0.5 + 0.1
        };

        scene.add(sprite);
        sprites.push(sprite);
    }

    camera.position.z = 5;

    let mouseX = 0;
    let mouseY = 0;

    // Support touch for mobile parallax
    document.addEventListener('mousemove', (event) => {
        mouseX = (event.clientX / window.innerWidth) - 0.5;
        mouseY = (event.clientY / window.innerHeight) - 0.5;
    });
    
    document.addEventListener('touchmove', (event) => {
        if(event.touches.length > 0) {
            mouseX = (event.touches[0].clientX / window.innerWidth) - 0.5;
            mouseY = (event.touches[0].clientY / window.innerHeight) - 0.5;
        }
    });

    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const elapsedTime = clock.getElapsedTime();

        sprites.forEach(sprite => {
            sprite.position.y += sprite.userData.speedY;
            const wobble = Math.sin(elapsedTime * sprite.userData.sinSpeed + sprite.userData.sinOffset) * 0.02;
            sprite.position.x += wobble + ((mouseX * sprite.userData.parallaxFactor + sprite.userData.initialX) - sprite.position.x) * 0.02;

            if (sprite.position.y > 12) {
                sprite.position.y = -12;
                sprite.userData.initialX = (Math.random() - 0.5) * 30;
            }
        });

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDRYR3XxiopH0Nh1iJPC55k7i2fBhB8dzg",
      authDomain: "growthwell-513dd.firebaseapp.com",
      projectId: "growthwell-513dd",
      storageBucket: "growthwell-513dd.firebasestorage.app",
      messagingSenderId: "379185657443",
      appId: "1:379185657443:web:0009cfb5dd19775f0eea56"
    };
    
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'growthwell-shop';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let compressedImageBase64 = null;
    let allProductsData = [];

    onAuthStateChanged(auth, (user) => {
      if (user) { loadData(); }
    });

    signInAnonymously(auth).catch(console.error);

    // View switching
    window.switchTab = (tab) => {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-view'));
      document.getElementById('view-' + tab).classList.add('active-view');
      
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      const activeBtn = document.getElementById('tab-' + tab);
      if(activeBtn) activeBtn.classList.add('active');
      
      document.getElementById('mobileNav').classList.add('hidden');
      window.scrollTo(0,0);
    };

    // Image clear logic
    window.clearImage = () => {
        document.getElementById('pImageFile').value = '';
        document.getElementById('previewContainer').classList.add('hidden');
        document.getElementById('imgPreview').src = '';
        compressedImageBase64 = null;
    };

    // --- IMAGE COMPRESSION LOGIC ---
    document.getElementById('pImageFile').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600; const MAX_HEIGHT = 600;
          let width = img.width; let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          } else {
            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
          }
          canvas.width = width; canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          compressedImageBase64 = canvas.toDataURL('image/jpeg', 0.6);
          
          document.getElementById('imgPreview').src = compressedImageBase64;
          document.getElementById('previewContainer').classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    // --- PRODUCT MANAGEMENT ---
    window.addProduct = async () => {
      const name = document.getElementById('pName').value.trim();
      const price = document.getElementById('pPrice').value;
      const typeRaw = document.getElementById('pType').value;
      const keywordsRaw = document.getElementById('pKeywords').value;
      const desc = document.getElementById('pDesc').value.trim();
      const image = compressedImageBase64 || 'https://images.unsplash.com/photo-1583337130417-3346a1be7dee?auto=format&fit=crop&w=400&q=80';
      const btn = document.getElementById('addBtn');

      if(!name || !price) return alert("Please enter product name and price.");

      // Store clean type (e.g. "Dog" instead of "Dog 🐶") for logic consistency
      const type = typeRaw.replace(/[^a-zA-Z]/g, '').trim();

      // Process keywords
      const keywords = keywordsRaw.split(',').map(k => k.trim().toLowerCase()).filter(k => k.length > 0);

      btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Publishing...`;
      btn.disabled = true;

      try {
        const prodData = { name, price: parseFloat(price), type, keywords, description: desc, image, createdAt: new Date().toISOString() };
        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'products'), prodData);
        
        document.getElementById('pName').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pKeywords').value = '';
        document.getElementById('pDesc').value = '';
        document.getElementById('pType').value = 'All';
        clearImage();
        
        alert("Product published successfully!");
      } catch (e) {
        console.error(e);
        alert("Error adding product.");
      } finally {
        btn.innerHTML = `<svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg> Publish Product`;
        btn.disabled = false;
      }
    };

    window.deleteProduct = async (id) => {
      if(confirm("Are you sure you want to permanently delete this product?")) {
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', id));
        } catch(e) { console.error(e); alert("Error deleting product!"); }
      }
    };

    // Render filtered products
    window.renderProducts = () => {
      const searchTerm = document.getElementById('searchProduct').value.toLowerCase();
      const filterTypeRaw = document.getElementById('filterPetType').value;
      const filterType = filterTypeRaw.replace(/[^a-zA-Z]/g, '').trim();
      const list = document.getElementById('adminProductList');
      list.innerHTML = '';

      let filtered = allProductsData.filter(p => {
         const matchSearch = p.name.toLowerCase().includes(searchTerm) || (p.keywords && p.keywords.some(k => k.includes(searchTerm)));
         const matchType = filterType === 'All' || p.type === filterType;
         return matchSearch && matchType;
      });

      if(filtered.length === 0) {
        list.innerHTML = '<div class="p-8 text-center text-slate-500">No products found matching your criteria.</div>';
        return;
      }

      filtered.forEach(p => {
        let typeBadge = p.type && p.type !== 'All' ? `<span class="text-[10px] bg-red-500/20 text-red-400 px-2 py-0.5 rounded uppercase tracking-wider font-bold whitespace-nowrap">${p.type}</span>` : '';
        
        list.innerHTML += `
          <div class="flex items-center justify-between bg-slate-800/40 p-3 md:p-4 rounded-xl border border-slate-700/50 hover:border-slate-500 transition group gap-3">
            <div class="flex items-center gap-3 overflow-hidden flex-grow">
              <img src="${p.image}" class="w-14 h-14 md:w-16 md:h-16 shrink-0 object-cover rounded-lg border border-slate-600 group-hover:border-red-500 transition shadow-md">
              <div class="flex flex-col min-w-0">
                <p class="font-bold text-white text-sm md:text-base truncate pr-2">${p.name}</p>
                <div class="flex items-center gap-2 mt-1 flex-wrap">
                  ${typeBadge}
                  <p class="text-red-400 font-extrabold text-sm whitespace-nowrap">Rs. ${parseFloat(p.price).toFixed(2)}</p>
                </div>
              </div>
            </div>
            <button onclick="deleteProduct('${p.id}')" class="shrink-0 text-slate-400 hover:text-white bg-slate-700/50 hover:bg-red-500 border border-slate-600 hover:border-red-500 p-2 md:px-4 md:py-2 rounded-lg md:rounded-xl text-xs font-bold transition flex items-center justify-center">
              <svg class="w-5 h-5 md:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              <span class="hidden md:inline">Delete</span>
            </button>
          </div>
        `;
      });
    };

    function loadData() {
        // Listen to products
        const pQuery = collection(db, 'artifacts', appId, 'public', 'data', 'products');
        onSnapshot(pQuery, (snap) => {
          allProductsData = [];
          snap.forEach(d => allProductsData.push({id: d.id, ...d.data()}));
          // Sort newly added first
          allProductsData.sort((a,b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
          renderProducts();
        }, (err) => console.error(err));

        // Listen to orders
        const oQuery = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
        onSnapshot(oQuery, (snap) => {
          const list = document.getElementById('adminOrdersList');
          list.innerHTML = '';
          if(snap.empty) {
            list.innerHTML = '<div class="glass-panel p-10 rounded-2xl text-center text-slate-500 border border-slate-700/50">No orders received yet.</div>';
            return;
          }

          let ordersArray = [];
          snap.forEach(d => ordersArray.push({ id: d.id, ...d.data() }));
          ordersArray.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

          ordersArray.forEach(o => {
            let itemsHtml = o.items.map(i => `<span class="bg-slate-700/50 text-slate-300 text-xs px-2.5 py-1 rounded border border-slate-600 mr-2 mb-2 inline-flex items-center gap-1">${i.name} <strong class="text-red-400">x${i.qty}</strong></span>`).join('');
            
            let isPending = o.status === 'Pending';
            let btnClass = isPending ? 'bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 shadow-emerald-500/20' : 'bg-slate-700 hover:bg-slate-600 border border-slate-600';
            let btnText = isPending ? 'Approve Order' : 'Revert to Pending';
            let statusBadge = isPending ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';

            list.innerHTML += `
              <div class="glass-panel p-4 md:p-6 rounded-2xl border border-slate-700/50 flex flex-col md:flex-row justify-between items-start md:items-center gap-5 hover:border-slate-500 transition w-full">
                <div class="flex-grow w-full">
                  <div class="flex items-center gap-2 md:gap-3 mb-4 flex-wrap">
                    <span class="font-extrabold text-lg md:text-xl text-white">#${o.orderId}</span>
                    <span class="text-[10px] md:text-xs text-slate-400 bg-slate-800 px-2 md:px-3 py-1 md:py-1.5 rounded-lg border border-slate-700">${o.createdAt}</span>
                    <span class="text-[10px] md:text-xs px-2 md:px-3 py-1 md:py-1.5 rounded-full font-bold border uppercase tracking-wider ${statusBadge}">${o.status}</span>
                  </div>
                  
                  <div class="text-xs md:text-sm text-slate-300 mb-4 grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-2 bg-slate-800/40 p-3 md:p-4 rounded-xl border border-slate-700/50">
                    <p class="flex items-center gap-2 truncate"><svg class="w-4 h-4 shrink-0 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg> ${o.customerName}</p>
                    <p class="flex items-center gap-2 truncate"><svg class="w-4 h-4 shrink-0 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg> ${o.customerPhone}</p>
                    <p class="sm:col-span-2 flex items-start gap-2"><svg class="w-4 h-4 mt-0.5 text-slate-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg> <span class="leading-relaxed">${o.customerAddress}</span></p>
                  </div>
                  
                  <div class="flex flex-wrap">
                    ${itemsHtml}
                  </div>
                </div>
                
                <div class="flex flex-row md:flex-col justify-between items-center md:items-end gap-4 min-w-full md:min-w-[180px] w-full md:w-auto border-t md:border-t-0 border-slate-700/50 pt-4 md:pt-0">
                  <div class="text-left md:text-right w-full md:w-auto">
                    <p class="text-[10px] md:text-xs text-slate-500 uppercase tracking-wider font-bold mb-0.5 md:mb-1">Total</p>
                    <span class="font-black text-red-400 text-xl md:text-3xl">Rs. ${parseFloat(o.totalAmount).toFixed(2)}</span>
                  </div>
                  <button onclick="updateOrderStatus('${o.id}', '${o.status}')" class="${btnClass} px-4 md:px-5 py-2.5 md:py-3 rounded-lg md:rounded-xl text-xs md:text-sm font-bold w-max md:w-full transition shadow-lg text-white shrink-0">
                    ${btnText}
                  </button>
                </div>
              </div>
            `;
          });
        }, (err) => console.error(err));
    }

    // --- ORDER MANAGEMENT (Status Update) ---
    window.updateOrderStatus = async (orderIdDoc, currentStatus) => {
        const newStatus = currentStatus === "Pending" ? "Approved" : "Pending";
        try {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderIdDoc), { status: newStatus });
        } catch(e) { console.error(e); alert("Failed to update status!"); }
    };

  </script>
</body>
</html>
